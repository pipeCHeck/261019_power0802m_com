<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f7f3" />
    <meta name="description" content="power0802m.com, 조만간 업데이트될 예정입니다..!" />
    <title>공간을 만드는 중 · power0802m.com</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/sb-aggro-light.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/game.css" />
    <link rel="stylesheet" href="/card.css" />
    <script src="/app.js" defer></script>
    <script src="/game.js" type="module"></script>
    <script src="/card.js" type="module"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="/" aria-label="power0802m.com 홈">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1v22M1 12h22M4.2 4.2l15.6 15.6M4.2 19.8 19.8 4.2" /></svg>
        <span>power0802m<span class="domain-suffix">.com</span></span>
      </a>
      <span class="site-status"><span class="status-light" aria-hidden="true"></span>UNDER CONSTRUCTION</span>
    </header>

    <main>
      <section class="coming-soon" aria-labelledby="construction-message">
        <div class="eyebrow"><span></span>WORK IN PROGRESS<span></span></div>
        <h1 id="construction-message">
          <span id="message" class="sr-only">콘텐츠 설계도 작성 중</span>
          <span class="message-window" aria-hidden="true">
            <span class="message-line is-current"><span class="message-content"><span class="message-text">콘텐츠 설계도 작성 중</span><span class="dots">.</span></span></span>
            <span class="message-line"><span class="message-content"><span class="message-text">HTML 구조물 설치 중</span><span class="dots">.</span></span></span>
            <span class="message-line"><span class="message-content"><span class="message-text">CSS 내·외장 마감재 선정 중</span><span class="dots">.</span></span></span>
            <span class="message-line"><span class="message-content"><span class="message-text">웹페이지 내부 인테리어 공사 중</span><span class="dots">.</span></span></span>
            <span class="message-line"><span class="message-content"><span class="message-text">반응형 구조 내진 설계 중</span><span class="dots">.</span></span></span>
          </span>
        </h1>
        <p class="description">조만간 업데이트될 예정입니다..!</p>
      </section>
    </main>

    <footer class="site-footer">
      <span class="contact-email">power0802m@naver.com</span>
      <span class="footer-divider" aria-hidden="true">·</span>
      <span class="site-version">v0.0.16</span>
    </footer>
    <div class="physics-card-layer">
      <article id="physics-card" class="physics-card" data-physics-card tabindex="0"
        aria-label="움직이는 카드. 드래그해서 움직이거나 방향키로 튕길 수 있습니다.">
        <h2>가나다라</h2>
        <p>가나다라</p>
      </article>
    </div>
    <canvas id="game-canvas" class="game-canvas" aria-hidden="true"></canvas>
    <div id="game-ball" class="game-ball" aria-hidden="true" hidden>
      <svg class="ball-shape" viewBox="0 0 100 100"><path d="M 50 0 A 50 50 0 1 1 50 100 A 50 50 0 1 1 50 0 Z" /></svg>
    </div>
    <div id="game-ball-tint" class="game-ball game-ball-tint" aria-hidden="true" hidden>
      <svg class="ball-shape" viewBox="0 0 100 100"><path /></svg>
    </div>
    <div id="game-score" class="game-score" aria-hidden="true" hidden><div class="score-window"></div></div>
    <div id="game-score-on-ball" class="game-score game-score-on-ball" aria-hidden="true" hidden><div class="score-window"></div></div>
    <svg class="game-clip-defs" width="0" height="0" aria-hidden="true">
      <defs>
        <clipPath id="score-ball-clip" clipPathUnits="userSpaceOnUse"><path id="score-ball-clip-path" /></clipPath>
        <mask id="score-ball-outside-mask" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="0" y="0" width="96" height="25" mask-type="luminance">
          <rect width="96" height="25" fill="white" />
          <path id="score-ball-mask-path" fill="black" />
        </mask>
      </defs>
    </svg>
    <p id="game-status" class="sr-only" role="status"></p>
  </body>
</html>
